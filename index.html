<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #1a202c;
      color: white;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">
  <div class="max-w-md w-full bg-gray-800 rounded-lg p-8 shadow-lg">
    <h1 class="text-4xl font-extrabold text-yellow-400 mb-6 text-center">FluxPlay</h1>

    <!-- Tabs -->
    <div class="flex justify-center mb-6 space-x-4">
      <button id="loginTab" class="px-6 py-2 rounded bg-yellow-400 text-gray-900 font-semibold">Login</button>
      <button id="registerTab" class="px-6 py-2 rounded bg-gray-700 hover:bg-yellow-400 hover:text-gray-900 font-semibold">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="">
      <input id="loginUsername" name="username" type="text" placeholder="Username" required
        class="w-full mb-4 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <input id="loginPassword" name="password" type="password" placeholder="Password" required
        class="w-full mb-6 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <button type="submit" class="w-full bg-yellow-400 text-gray-900 font-bold py-2 rounded hover:bg-yellow-300 transition">
        Login
      </button>
    </form>

    <!-- Register Form (hidden by default) -->
    <form id="registerForm" class="hidden">
      <input id="regFullname" name="fullname" type="text" placeholder="Full Name" required
        class="w-full mb-4 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <input id="regUsername" name="username" type="text" placeholder="Username" required
        class="w-full mb-4 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <input id="regEmail" name="email" type="email" placeholder="Email" required
        class="w-full mb-4 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <input id="regPassword" name="password" type="password" placeholder="Password" required
        class="w-full mb-6 px-4 py-2 rounded bg-gray-700 text-white focus:outline-none" />
      <button type="submit" class="w-full bg-yellow-400 text-gray-900 font-bold py-2 rounded hover:bg-yellow-300 transition">
        Register
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
