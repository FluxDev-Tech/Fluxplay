<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Orbitron Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
    }

    .animate-fadeIn {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tab-active {
      @apply bg-yellow-400 text-gray-900 shadow-md;
    }

    .tab-inactive {
      @apply bg-gray-700 text-white hover:bg-gray-600;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white transition duration-300">
  <main class="w-full max-w-md bg-gray-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-yellow-500 animate-fadeIn">
    <h1 class="text-4xl font-extrabold text-center text-yellow-400 mb-8 tracking-wide">FluxPlay</h1>

    <!-- Login Form -->
    <form id="loginForm" class="form-section flex flex-col gap-5 animate-fadeIn" novalidate>
      <label class="flex flex-col text-sm font-medium text-gray-300">
        Username
        <input
          id="username"
          name="username"
          type="text"
          required
          placeholder="Enter username"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <label class="flex flex-col text-sm font-medium text-gray-300">
        Password
        <input
          id="password"
          name="password"
          type="password"
          required
          placeholder="Enter password"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <button type="submit" class="mt-3 bg-yellow-400 text-gray-900 font-extrabold py-3 rounded-xl hover:bg-yellow-500 transition-all">
        Login
      </button>

      <p class="text-center text-sm text-gray-500 mt-4">
  Use default login:
  <code class="text-indigo-500 font-semibold">admin</code> /
  <code class="text-emerald-500 font-semibold">player1</code><br />
  or <span class="italic text-rose-500">mag-register ka nalang 🤦</span>
      </p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="form-section hidden flex flex-col gap-5 animate-fadeIn" novalidate>
      <label class="flex flex-col text-sm font-medium text-gray-300">
        Full Name
        <input
          id="regFullName"
          type="text"
          required
          placeholder="Your full name"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <label class="flex flex-col text-sm font-medium text-gray-300">
        Username
        <input
          id="regUsername"
          type="text"
          required
          placeholder="Choose a username"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <label class="flex flex-col text-sm font-medium text-gray-300">
        Email
        <input
          id="regEmail"
          type="email"
          required
          placeholder="Your email address"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <label class="flex flex-col text-sm font-medium text-gray-300">
        Password
        <input
          id="regPassword"
          type="password"
          required
          placeholder="Create a strong password"
          class="mt-2 px-4 py-3 rounded-xl text-gray-900 focus:outline-none focus:ring-4 focus:ring-yellow-400"
        />
      </label>

      <button type="submit" class="mt-3 bg-yellow-400 text-gray-900 font-extrabold py-3 rounded-xl hover:bg-yellow-500 transition-all">
        Create Account
      </button>
    </form>

    <!-- Tab Buttons Moved to Bottom -->
    <div class="flex justify-center mt-8 gap-6">
      <button
        id="loginTab"
        class="tab-btn px-6 py-2 rounded-full font-semibold text-lg tab-active transition-all"
      >
        Login
      </button>
      <button
        id="registerTab"
        class="tab-btn px-6 py-2 rounded-full font-semibold text-lg tab-inactive transition-all"
      >
        Register
      </button>
    </div>
  </main>

  <!-- Tab Switch Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginTab = document.getElementById('loginTab');
      const registerTab = document.getElementById('registerTab');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      loginTab.addEventListener('click', () => {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.classList.add('tab-active');
        loginTab.classList.remove('tab-inactive');
        registerTab.classList.remove('tab-active');
        registerTab.classList.add('tab-inactive');
      });

      registerTab.addEventListener('click', () => {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        registerTab.classList.add('tab-active');
        registerTab.classList.remove('tab-inactive');
        loginTab.classList.remove('tab-active');
        loginTab.classList.add('tab-inactive');
      });
    });
  </script>

  <!-- App Logic -->
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
