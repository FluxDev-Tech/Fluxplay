<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #1a202c;
      color: white;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900 dark:bg-gray-100 dark:text-gray-900 transition-colors duration-300">

  <main class="w-full max-w-md bg-gray-800 dark:bg-gray-200 p-8 rounded-xl shadow-lg">
    <h1 class="text-4xl font-extrabold mb-8 text-yellow-400 dark:text-yellow-600 text-center">FluxPlay Login</h1>
    <form id="loginForm" class="flex flex-col gap-6" novalidate>
      <label class="flex flex-col text-gray-300 dark:text-gray-700">
        Username
        <input id="username" type="text" required placeholder="Enter username" class="mt-1 px-4 py-2 rounded-md text-gray-900" />
      </label>
      <label class="flex flex-col text-gray-300 dark:text-gray-700">
        Password
        <input id="password" type="password" required placeholder="Enter password" class="mt-1 px-4 py-2 rounded-md text-gray-900" />
      </label>
      <button type="submit" class="bg-yellow-400 dark:bg-yellow-600 text-gray-900 font-bold py-3 rounded-lg hover:bg-yellow-500 dark:hover:bg-yellow-700 transition">
        Login
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-400 dark:text-gray-600">Use <code>player</code> / <code>1234</code> to login</p>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
