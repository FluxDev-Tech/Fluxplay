<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Login</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Orbitron Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
    }
    /* Fade-in animation for forms */
    .animate-fadeIn {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white transition duration-300">

  <main class="w-full max-w-lg bg-gray-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-yellow-500">
    <h1 class="text-5xl font-extrabold text-center text-yellow-400 mb-8">FluxPlay</h1>

    <!-- Tabs -->
    <div class="flex justify-center mb-6 space-x-4">
      <button id="loginTab" class="tab-btn px-6 py-2 rounded-full font-semibold text-sm bg-yellow-400 text-gray-900 shadow-md">Login</button>
      <button id="registerTab" class="tab-btn px-6 py-2 rounded-full font-semibold text-sm bg-gray-700 hover:bg-gray-600 transition">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form-section flex flex-col gap-5 animate-fadeIn" novalidate>
      <label class="flex flex-col text-sm">
        Username
        <input id="loginUsername" name="username" type="text" required placeholder="Enter username" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <label class="flex flex-col text-sm">
        Password
        <input id="loginPassword" name="password" type="password" required placeholder="Enter password" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <button type="submit" class="bg-yellow-400 text-gray-900 font-bold py-3 rounded-lg hover:bg-yellow-500 transition">
        Login
      </button>
      <p class="text-center text-xs text-gray-400">Try: <code>player</code> / <code>1234</code></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="form-section hidden flex-col gap-5 animate-fadeIn" novalidate>
      <label class="flex flex-col text-sm">
        Full Name
        <input id="regFullName" name="fullname" type="text" required placeholder="Your full name" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <label class="flex flex-col text-sm">
        Username
        <input id="regUsername" name="username" type="text" required placeholder="Choose a username" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <label class="flex flex-col text-sm">
        Email
        <input id="regEmail" name="email" type="email" required placeholder="Your email address" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <label class="flex flex-col text-sm">
        Password
        <input id="regPassword" name="password" type="password" required placeholder="Create a strong password" class="mt-1 px-4 py-2 rounded-md text-gray-900 focus:outline-none" />
      </label>
      <button type="submit" class="bg-yellow-400 text-gray-900 font-bold py-3 rounded-lg hover:bg-yellow-500 transition">
        Create Account
      </button>
    </form>
  </main>

  <!-- Link to external JS file -->
  <script src="app.js" defer></script>
</body>
</html>
