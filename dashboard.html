<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>
<script>
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const profile = JSON.parse(localStorage.getItem('profile'));
  if (!profile) window.location.href = 'login.html';
</script>

<div class="min-h-screen flex flex-col lg:flex-row">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">FluxPlay</h2>
      <button id="sidebarCloseBtn" class="sidebar-close">✖</button>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link active">🎮 Dashboard</a>
      <a href="profile.html" class="nav-link">👤 Profile</a>
      <a href="stats.html" class="nav-link">📊 Stats</a>
      <a href="shop.html" class="nav-link">🛒 Shop</a>
      <a href="logout.html" class="nav-link logout">🚪 Logout</a>
    </nav>
    <div class="sidebar-footer">
      <button id="themeToggleBtn" class="theme-toggle">
        <svg id="sunIcon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 7.05L5.636 5.636M12 7a5 5 0 110 10 5 5 0 010-10z" />
        </svg>
        <svg id="moonIcon" class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293a8 8 0 11-10.586-10.586 7 7 0 0010.586 10.586z" />
        </svg>
        <span>Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="header">
      <button id="sidebarToggleBtn" class="text-yellow-400 dark:text-yellow-600 text-3xl">☰</button>
      <h1 class="text-xl font-bold">FluxPlay</h1>
    </header>

    <section class="flex justify-between items-center mb-8">
      <h1 class="dashboard-title">Dashboard</h1>
      <div class="user-info">
        <span id="displayName" class="text-sm text-gray-400 dark:text-gray-600"></span>
        <img src="assets/img/avatar.png" alt="Avatar" class="avatar" />
      </div>
    </section>

    <section class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-12">
      <div class="stats-card stats-purple">
        <h3 class="text-xl font-bold mb-2">Games Played</h3>
        <p class="text-4xl font-extrabold">128</p>
      </div>
      <div class="stats-card stats-pink">
        <h3 class="text-xl font-bold mb-2">Trophies</h3>
        <p class="text-4xl font-extrabold">32</p>
      </div>
      <div class="stats-card stats-yellow">
        <h3 class="text-xl font-bold mb-2">Online Hours</h3>
        <p class="text-4xl font-extrabold">712h</p>
      </div>
    </section>

    <section>
      <h2 class="section-title">Your Games</h2>
      <div class="games-grid">
        <article class="game-card">
          <img src="assets/img/game1.jpg" alt="Cyber Arena" class="rounded-lg mb-4" />
          <h3 class="game-title">Cyber Arena</h3>
          <p class="game-desc">Sci-fi PvP shooter</p>
        </article>
        <article class="game-card">
          <img src="assets/img/game2.jpg" alt="Dragon Valley" class="rounded-lg mb-4" />
          <h3 class="game-title">Dragon Valley</h3>
          <p class="game-desc">Fantasy MMORPG</p>
        </article>
        <article class="game-card">
          <img src="assets/img/game3.jpg" alt="Mecha Storm" class="rounded-lg mb-4" />
          <h3 class="game-title">Mecha Storm</h3>
          <p class="game-desc">Multiplayer Mech Battles</p>
        </article>
      </div>
    </section>

    <section class="mt-12">
      <h2 class="section-title">Login Frequency</h2>
      <div id="loginFrequencyContainer" class="history-box"></div>
    </section>

    <section class="mt-12">
      <h2 class="section-title">Purchase History</h2>
      <div id="purchaseListContainer" class="history-box"></div>
    </section>
  </main>
</div>

<script>
  const profileData = JSON.parse(localStorage.getItem('profile'));
  const username = profileData?.username || 'Unknown User';
  document.getElementById('displayName').textContent = username;

  function displayLoginFrequency() {
    const loginCounts = JSON.parse(localStorage.getItem('loginCounts')) || {};
    const container = document.getElementById('loginFrequencyContainer');
    container.innerHTML = '';
    const sortedUsers = Object.entries(loginCounts).sort((a, b) => b[1] - a[1]);
    sortedUsers.forEach(([user, count]) => {
      const p = document.createElement('p');
      p.textContent = `${user}: ${count} logins`;
      container.appendChild(p);
    });
    if (sortedUsers.length === 0) {
      container.textContent = 'No login data available.';
    }
  }

  function displayPurchases() {
    const purchases = JSON.parse(localStorage.getItem('purchases')) || [];
    const container = document.getElementById('purchaseListContainer');
    container.innerHTML = '';
    if (purchases.length === 0) {
      container.textContent = 'No purchases yet.';
      return;
    }
    purchases.forEach(({ username, gameTitle, date }) => {
      const p = document.createElement('p');
      p.textContent = `${username} bought "${gameTitle}" on ${new Date(date).toLocaleString()}`;
      container.appendChild(p);
    });
  }

  displayLoginFrequency();
  displayPurchases();
</script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
