<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FluxPlay | Game Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <script defer src="app.js"></script>
  <style>
    .modal {
      background-color: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="bg-gray-900 text-white font-[Orbitron]">
  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4 bg-gray-800 shadow">
    <h1 class="text-2xl font-bold">🛒 FluxPlay Game Shop</h1>
    <nav class="space-x-6">
      <a href="home.html" class="hover:text-purple-400">Home</a>
      <a href="shop.html" class="hover:text-purple-400">Shop</a>
      <a href="dashboard.html" class="hover:text-purple-400">Dashboard</a>
    </nav>
  </header>

  <!-- Shop Grid -->
  <section class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6">
    <!-- Game Card Example -->
    <div class="bg-gray-800 p-4 rounded-xl shadow hover:shadow-xl transition-all transform hover:scale-105">
      <img src="https://placehold.co/300x180" alt="Game Cover" class="rounded mb-3 w-full" />
      <h3 class="text-xl font-semibold">Cyber Rage</h3>
      <p class="text-gray-400 text-sm">Action RPG | 2025</p>
      <p class="mt-2 text-purple-400 font-bold">$49.99</p>
      <button onclick="buyGame('Cyber Rage', '$49.99')" class="mt-4 w-full bg-purple-600 hover:bg-purple-700 py-2 rounded transition">Buy Now</button>
    </div>

    <!-- More game cards can be added here... -->
  </section>

  <!-- Modal -->
  <div id="purchaseModal" class="fixed inset-0 hidden items-center justify-center z-50 modal">
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg max-w-sm w-full text-center animate-bounce">
      <h2 class="text-2xl font-bold mb-4">Confirm Purchase</h2>
      <p id="gameTitle" class="text-lg text-purple-400 mb-2"></p>
      <p id="gamePrice" class="text-gray-300 mb-4"></p>
      <div class="flex justify-center space-x-4">
        <button onclick="confirmPurchase()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Confirm</button>
        <button onclick="closeModal()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
