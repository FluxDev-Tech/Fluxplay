<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logging Out | FluxPlay</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
  <div class="text-center">
    <h1 class="text-4xl font-extrabold text-yellow-400 mb-4">FluxPlay</h1>
    <p class="text-lg" id="logoutMessage">Logging you out...</p>
  </div>

  <script src="assets/js/app.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Show logout message
      const message = document.getElementById('logoutMessage');
      message.textContent = 'Logging you out...';

      // Clear session data
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('profile');
      localStorage.removeItem('avatar');
      localStorage.removeItem('bio');

      // Redirect to login.html after 1.5 seconds
      setTimeout(() => {
        window.location.replace('login.html');
      }, 1500);
    });
  </script>
</body>
</html>
