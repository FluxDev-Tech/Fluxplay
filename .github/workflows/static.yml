name: 🚀 Deploy Fluxplay to GitHub Pages

on:
  push:
    branches: ["yuji"]  # or your deployment branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # e.g. npm ci or other install commands
          npm ci

      - name: Build site
        run: |
          # e.g. npm run build or hugo etc.
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # change to your build output directory

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        
